name: Build NeonShooter APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project
        uses: actions/checkout@v4

      - name: Install Android tools
        uses: android-actions/setup-android@v3

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Get raylib Android template
        run: |
          git clone --depth 1 https://github.com/raylib-extras/raymob.git raymob

      - name: Show project files
        run: |
          echo "Project files:"
          ls -la
          echo "Raymob template:"
          ls -la raymob